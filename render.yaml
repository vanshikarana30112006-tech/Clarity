services:
  - type: web
    name: clarity-assignment-evaluation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-lock.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --limit-concurrency 16
    healthCheckPath: /api/health
    envVars:
      - key: CLARITY_PUBLIC_DEMO
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
